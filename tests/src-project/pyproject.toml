[project]
name = "src-project"
dynamic = ["version"]
description = "Default template for PDM package"
authors = [
    {name = "Waket Zheng",email = "waketzheng@gmail.com"},
]
dependencies = []
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm.version]
path = "src/src_project/__init__.py"

[tool.pdm]
distribution = true
